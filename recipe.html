<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Recipe</title>

    <link rel="stylesheet" href="bootstrap/bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-light">

        <div class="container">

            <a class="navbar-brand" href="dashboard.html">
                RecipeShare
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="all-recipes.html">
                            All Recipes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="my-recipes.html">
                            My Recipes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="recipe.html">
                            Add Recipe
                        </a>
                    </li>

                    <li class="nav-item">
                        <button class="btn btn-outline-dark" id="logoutBtn">
                            Logout
                        </button>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8">

                <h1 class="mb-4">
                    Create Recipe
                </h1>

                <form id="recipeForm">

                    <div class="mb-3">

                        <label class="form-label">
                            Recipe Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            placeholder="Enter recipe title"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="description"
                            rows="3"
                            placeholder="Enter recipe description"
                        ></textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select class="form-select" id="category">

                            <option value="">
                                Select Category
                            </option>

                            <option value="Breakfast">
                                Breakfast
                            </option>

                            <option value="Lunch">
                                Lunch
                            </option>

                            <option value="Dinner">
                                Dinner
                            </option>

                            <option value="Dessert">
                                Dessert
                            </option>

                            <option value="Drinks">
                                Drinks
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Ingredients
                        </label>

                        <textarea
                            class="form-control"
                            id="ingredients"
                            rows="5"
                            placeholder="Enter ingredients"
                        ></textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Instructions
                        </label>

                        <textarea
                            class="form-control"
                            id="instructions"
                            rows="5"
                            placeholder="Enter cooking instructions"
                        ></textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Cooking Time
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="cookingTime"
                            placeholder="Example: 30 minutes"
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Recipe Image
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="recipeImage"
                            accept="image/*"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark"
                        id="createRecipeBtn">
                        Create Recipe
                    </button>

                </form>

            </div>

        </div>

    </div>


    <script src="bootstrap/bootstrap.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>

</html>
