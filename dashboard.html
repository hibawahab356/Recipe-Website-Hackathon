      <link rel="stylesheet" href="bootstrap/bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    






    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-light">

        <div class="container">

            <a class="navbar-brand" href="dashboard.html">
                RecipeShare
            </a>


            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="all-recipes.html">
                            All Recipes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="my-recipes.html">
                            My Recipes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="create-recipe.html">
                            Add Recipe
                        </a>
                    </li>

                    <li class="nav-item">
                        <button class="btn btn-outline-dark" id="logoutBtn">
                            Logout
                        </button>
                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- Dashboard -->

    <div class="container py-5">


        <!-- Welcome -->

        <div class="mb-4">

            <h1>Welcome Back!</h1>

            <p class="text-muted">
                Create and share your favorite recipes.
            </p>

            <a href="create-recipe.html" class="btn btn-dark">
                Add Recipe
            </a>

        </div>



        <!-- Stats -->

        <div class="row g-3 mb-5">


            <div class="col-12 col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h5>Total Recipes</h5>

                        <h2 id="totalRecipes">0</h2>

                    </div>

                </div>

            </div>


            <div class="col-12 col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h5>My Recipes</h5>

                        <h2 id="myRecipes">0</h2>

                    </div>

                </div>

            </div>


        </div>



        <!-- Recent Recipes -->

        <div>

            <h2 class="mb-3">
                Recent Recipes
            </h2>


            <div class="row g-3" id="recipeContainer">

            </div>

        </div>


    </div>











    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
